<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VITAL</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#05070a;color:#f0f4ff;font-family:"DM Mono",monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;}
.ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 30% 20%,rgba(0,229,160,0.06) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 70% 80%,rgba(123,92,250,0.06) 0%,transparent 60%);}
.wrap{position:relative;z-index:1;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;}
.logo{font-family:"Syne",sans-serif;font-weight:800;font-size:48px;letter-spacing:-2px;margin-bottom:12px;}
.logo span{color:#00e5a0;}
.copy{font-size:13px;color:#6b7a99;text-align:center;line-height:1.8;margin-bottom:52px;}
.cta{width:100%;background:#00e5a0;color:#000;border:none;border-radius:12px;padding:16px;font-family:"Syne",sans-serif;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:16px;}
.signin{font-size:11px;color:#6b7a99;}
.signin a{color:#00e5a0;text-decoration:none;}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="wrap">
  <div class="logo">VIT<span>AL</span></div>
  <div class="copy">Know your body<br>before it tells you.</div>
  <button class="cta" onclick="window.location.href='/auth.html'">Get Started</button>
  <div class="signin">Already have an account? <a href="/auth.html">Sign in</a></div>
</div>
</body>
</html>
